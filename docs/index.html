<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>main.pdf</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100%; }
    .pdf { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- ブラウザがPDF表示に対応していればここに表示されます -->
  <object class="pdf wrap" data="./main.pdf" type="application/pdf">
    <!-- 表示できない環境向けフォールバック -->
    <p>PDFを表示できません。こちらから開いてください：
      <a href="./main.pdf">./main.pdf</a>
    </p>
  </object>
</body>
</html>
