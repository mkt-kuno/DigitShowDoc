title: DigitShowDoc
description: DigitShowModbus ドキュメント

markdown: kramdown
kramdown:
  auto_ids: true
  syntax_highlighter: rouge
  parse_block_html: true

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-readme-index
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: true

readme_index:
  enabled: true
  remove_original: true

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore