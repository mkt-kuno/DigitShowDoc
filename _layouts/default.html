<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: false
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js" defer></script>
</head>
<body>
  <header>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      |
      <a href="{{ '/quickstart' | relative_url }}">クイックスタート</a>
      |
      <a href="{{ '/user_manual' | relative_url }}">ユーザーマニュアル</a>
      |
      <a href="{{ '/developer_manual' | relative_url }}">デベロッパーマニュアル</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <hr>
  <footer>
    <p><a href="https://github.com/mkt-kuno/DigitShowDoc">GitHub リポジトリ</a> | <a href="{{ '/howtomd' | relative_url }}">作成ガイド</a></p>
  </footer>
</body>
</html>
