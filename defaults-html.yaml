# HTML ビルド設定: pandoc --defaults=defaults-html.yaml
# main.tex (Pandoc対応LaTeX) -> main.html (MathJax)
input-files:
  - main.tex
reader: latex
to: html
output-file: main.html
standalone: true
toc: true
toc-depth: 2
number-sections: true
top-level-division: chapter
html-math-method: mathjax
css:
  - pandoc/html.css
variables:
  maxwidth: 80em
metadata:
  lang: ja
