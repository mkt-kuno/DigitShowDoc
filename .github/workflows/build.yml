name: Deploy Markdown to Pages

concurrency:
  group: "pages"
  cancel-in-progress: true

on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy markdown files to docs
        run: |
          mkdir -p docs
          cp *.md docs/ 2>/dev/null || true
          cp -r img docs/ 2>/dev/null || true
          # Create a simple index.html that redirects to the markdown viewer or renders markdown
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>DigitShow Modbus Documentation</title>
              <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
              <style>
                  .markdown-body {
                      box-sizing: border-box;
                      min-width: 200px;
                      max-width: 980px;
                      margin: 0 auto;
                      padding: 45px;
                  }
                  @media (max-width: 767px) {
                      .markdown-body { padding: 15px; }
                  }
              </style>
          </head>
          <body>
              <article class="markdown-body" id="content">
                  <h1>Loading...</h1>
              </article>
              <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
              <script>
                  async function loadMarkdown() {
                      try {
                          const response = await fetch('index.md');
                          const markdown = await response.text();
                          document.getElementById('content').innerHTML = marked.parse(markdown);
                      } catch (error) {
                          document.getElementById('content').innerHTML = '<h1>Error loading documentation</h1><p>' + error + '</p>';
                      }
                  }
                  loadMarkdown();
              </script>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4
